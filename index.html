ظ پوست"],"id":"F-317","cat":"کاربر","source":"ورودی کاربر","status":"کامل","notes":""},{"title":"کلد کرم — موم ستیل استر، موم سفید و مینرال اویل","ingredients":[["موم ستیل استر","125"],["موم سفید","120"],["مینرال اویل یا پارافین مایع","560"],["سدیم بورات","5"],["آب مقطر","تا 1000"]],"method":"موم‌ها را ذوب می‌کنیم و با مینرال اویل مخلوط می‌کنیم. تا ۷۰ درجه حرارت می‌دهیم. انحلال سدیم بورات در آب. محلول آبی را به آرامی به مخلوط اول اضافه می‌کنیم و به سرعت هم می‌زنیم. سپس صبر می‌کنیم تا سرد شود.","application":"پایه کلد کرم","dosage_form":"کرم","categories":["پایه"],"id":"F-318","cat":"کاربر","source":"ورودی کاربر","status":"کامل","notes":""},{"title":"آکوا بیس/آکوافور + لانولین + گلیسیرین + روغن جوانه گندم","ingredients":[["آکوا بیس ۵۵ (حاوی مینرال اویل، موم مینرال و ...) یا آکوافور","55"],["لانولین","15"],["گلیسیرین","15"],["ویت جرم اویل (Wheat Germ Oil)","15"]],"method":"میکس لانولین و گلیسیرین و ویت جرم اویل. افزودن به آکوا بیس.","application":"درمان زخم پای دیابتی","dosage_form":"کرم/پماد","categories":["محافظ پوست"],"id":"F-319","cat":"کاربر","source":"ورودی کاربر","status":"کامل","notes":"آکوافور به‌صورت امولسیون آب در روغن حاوی وازلین و مینرال اویل ذکر شده است."},{"title":"روغن جوانه گندم + کره کاکائو + روغن زیتون","ingredients":[["ویت جرم اویل (Wheat Germ Oil)","25"],["کره کاکائو","50"],["روغن زیتون","25"]],"method":"میکس روغن زیتون با ویت جرم اویل. ذوب کردن کره کاکائو و افزودن به مخلوط بالا.","application":"درمان زخم پای دیابتی","dosage_form":"پماد/چرب‌فرآورده","categories":["محافظ پوست"],"id":"F-320","cat":"کاربر","source":"ورودی کاربر","status":"کامل","notes":""},{"title":"کاد لیور اویل + لانولین + وازلین سفید","ingredients":[["روغن Cod Liver Oil (کاد لیور اویل)","25"],["لانولین","25"],["وازلین سفید","50"]],"method":"میکس کاد لیور اویل و لانولین. افزودن وازلین سفید.","application":"درمان زخم پای دیابتی","dosage_form":"پماد","categories":["محافظ پوست"],"id":"F-321","cat":"کاربر","source":"ورودی کاربر","status":"کامل","notes":""},{"title":"میزوپروستول + فنیتوئین + کتوپروفن + لیدوکائین در پایه امولسیون O/W","ingredients":[["میزوپروستول","0.0025"],["فنیتوئین","2"],["کتوپروفن","2"],["لیدوکائین","2"],["پروپیلن گلایکول","به مقدار لازم"],["پایه امولسیون روغن در آب","تا 100"]],"method":"خرد و صلایه کردن ۱۲.۵ قرص میزوپروستول ۲۰۰ میکروگرمی. لویگه با پروپیلن گلایکول. میکس فنیتوئین و کتوپروفن و لیدوکائین و لویگه با پروپیلن گلایکول. میکس دو مخلوط و افزودن به پایه امولسیون.","application":"زخم دیابتی","dosage_form":"کرم","categories":["محافظ پوست"],"id":"F-322","cat":"کاربر","source":"ورودی کاربر","status":"کامل","notes":""},{"title":"ژل دیکلوفناک سدیم ۱.۵٪","ingredients":[["دیکلوفناک سدیم","1.5"],["پروپیلن گلایکول","10"],["کربومر 940","0.75"],["اتانول 95 درصد","50"],["ترولامین","به مقدار لازم"],["آب مقطر","تا 100"]],"method":"میکس دیکلوفناک و کربومر و پروپیلن گلایکول. افزودن الکل. افزودن مقداری آب. افزودن ترولامین تا به ویسکوزیته مناسب با pH ۶ برسد. با آب به حجم می‌رسانیم.","application":"درمان آفتاب سوختگی","dosage_form":"ژل","categories":["ضد التهاب"],"id":"F-323","cat":"کاربر","source":"ورودی کاربر","status":"کامل","notes":""},{"title":"شامپو فلوکونازول ۲٪","ingredients":[["فلوکونازول","2"],["شامپو","100"]],"method":"میکس فلوکونازول در مقداری شامپو تا یکدست شود. افزودن به باقیمانده شامپو.","application":"درمان درماتیت و تینه آ ورسیکالر","dosage_form":"شامپو","categories":["ضد قارچ"],"id":"F-324","cat":"کاربر","source":"ورودی کاربر","status":"کامل","notes":"باید ۵ دقیقه روی سر بماند و بعد شسته شود. در صورت ته‌نشین شدن قبل از استفاده هم زده شود."}],"monographs":[{"id":"M-001","title":"اسید استیک","content":"مایع شفاف و بی‌رنگ با بوی تند و مزه اسیدی؛ نقطه ذوب ۱۷°درجه سانتی‌گراد. در آب، الکل و گلیسیرین محلول است. کاربردها: اسیدی‌کننده، بافر، ضدباکتری و ضدقارچ. ناسازگار با بازها و اکسیدکننده‌ها. غلظت‌های بالاتر از ۵۰٪ برای پوست و مخاط محرک‌اند. نگهداری در دمای اتاق.","categories":["اسیدیفایر","ضد باکتری","ضد قارچ","بافر"]},{"id":"M-002","title":"استون","content":"مایع شفاف، بی‌رنگ و فرّار با بوی مشخص و مزه شیرین تند؛ نقطه جوش ۵۶°درجه سانتی‌گراد. با آب و الکل و بیشتر روغن‌های فرّار امتزاج‌پذیر است. حلال است. ناسازگار با بازها، اکسیدکننده‌ها و ترکیبات کلردار. بسیار قابل اشتعال و برای چشم شدیداً محرک است.","categories":["حلال"]},{"id":"M-003","title":"روغن بادام","content":"مایع روغنی شفاف و بی‌رنگ یا زرد کم‌رنگ؛ تقریباً بی‌بو با طعم ملایم و مطبوع/مغزی (تلخ یا شیرین). کمی در الکل محلول است. کاربردها: نرم‌کننده، حلال، وسیله فرمولاسیون، عامل لوژیکیشن، رایحه و طعم‌دهنده. در ظرف مقاوم به نور نگهداری شود.","categories":["نرم‌کننده","حلال","وسیله/پایه"]},{"id":"M-004","title":"زاج","content":"سولفات آلومینیوم پتاسیم هیدراته؛ پودر یا کریستال سفید/بی‌رنگ، بی‌بو، کمی شیرین و بسیار قابض؛ نقطه ذوب ۹۲°درجه سانتی‌گراد. در آب، به‌ویژه آب داغ/جوش، محلول و در اتانول نامحلول است. قابض و رسوب‌دهنده پروتئین. ناسازگار با اکسیدکننده‌های قوی و آلومینیوم، مس، فولاد و روی.","categories":["قابض"]},{"id":"M-005","title":"آلومینیوم کلراید","content":"پودر کریستالی سفید یا سفید مایل به زرد، بی‌بو یا دارای بوی خفیف اسید هیدروکلریک. قابض و ضدتعریق. در آب به‌خوبی محلول است و در اتانول، اتر، پروپیلن گلایکول و گلیسیرین محلولیت کمتری دارد. فرم بی‌آب می‌تواند خطر انفجار داشته باشد.","categories":["ضد تعریق","قابض"]},{"id":"M-006","title":"آمونیوم لاکتات","content":"در آب، گلیسیرین و اتانول ۹۵٪ محلول است. مرطوب‌کننده و نگهدارنده رطوبت در کرم‌ها و لوسیون‌های پوست خشک. ناسازگار با پماد کلسـی‌پوتریول.","categories":["مرطوب‌کننده","نرم‌کننده","حلال"]},{"id":"M-007","title":"آنترالین","content":"پودر کریستالی زرد تا قهوه‌ای، بی‌بو و بی‌مزه؛ نقطه ذوب ۱۸۰°درجه سانتی‌گراد. در استون محلول، در الکل و اسید استیک کم‌محلول و در آب نامحلول است. با آزادسازی رادیکال‌های آزاد موجب آپوپتوز کراتینوسیت‌ها می‌شود. کاربرد: پسوریازیس و آلوپسی آره‌آتا. در محیط آبی، دمای بالا، حضور فلزات و اکسیژن ناپایدار است؛ اسید سالیسیلیک و ویتامین درجه سانتی‌گراد می‌توانند پایداری را افزایش دهند. دور از نور نگهداری شود.","categories":["ضد پسوریازیس","کراتولیتیک","ریزش مو"]},{"id":"M-008","title":"اسکوربیک اسید / ویتامین C","content":"پودر کریستالی بی‌بو، سفید تا زرد کم‌رنگ با مزه تند اسیدی؛ در نور تیره می‌شود؛ نقطه ذوب ۹۰°درجه سانتی‌گراد. در آب محلول است. آنتی‌اکسیدان در فرمولاسیون‌های آبی. ناسازگار با محیط قلیایی، فلزات سنگین و اکسیدکننده‌ها. در ظرف مقاوم به نور و غیرفلزی نگهداری شود.","categories":["آنتی‌اکسیدان"]},{"id":"M-009","title":"بنزوئیک اسید","content":"پودر یا کریستال سفید و سبک، بی‌بو و بی‌مزه؛ نقطه ذوب ۱۲۲°درجه سانتی‌گراد و در ۱۰۰°درجه سانتی‌گراد تصعید می‌شود. در اتانول محلول است. نگهدارنده ضدمیکروبی و ضدقارچ. ناسازگار با محیط‌های قلیایی و فلزات سنگین.","categories":["ضد قارچ","ضد باکتری"]},{"id":"M-010","title":"تنتور بنزویین","content":"پایه محافظ پوستی برای تحریک پوست، ترک نوک پستان، فیشر و زخم فشاری. برخلاف کلودیون اثر پوشاننده و فیلم‌ساز ندارد و در فرمول پودوفیلین وقتی محدود کردن جذب مطلوب است مناسب است. قابل اشتعال و ناسازگار با آب. در ظرف مقاوم به نور نگهداری شود.","categories":["محافظ پوست","پایه"]},{"id":"M-011","title":"بنزوئیل پروکساید","content":"پودر دانه‌ای یا آمورف سفید با بوی مشخص؛ برای کاهش خطر انفجار به‌صورت هیدراته عرضه می‌شود. کمی در آب و اتانول محلول است. لایه‌بردار و ضدباکتری موضعی برای آکنه. حلالیت آن با قطبیت رابطه معکوس دارد. ناسازگار با ترتینوئین.","categories":["ضد آکنه","اکسیدکننده"]},{"id":"M-012","title":"بنزیل بنزوات","content":"مایع روغنی شفاف و بی‌رنگ با بوی عطری و مزه تند/سوزان؛ نقطه ذوب ۲۱°درجه سانتی‌گراد. در روغن‌ها و اتانول محلول و در آب و گلیسیرین نامحلول است. کاربرد: حلال، پلاستی‌سایزر، حشره‌کش، ضدگال و ضدکنه؛ همچنین در کاربردهای حیوانی. می‌تواند پوست را تحریک کند. ناسازگار با مواد اکسیدکننده و قلیایی. از نور محافظت شود.","categories":["حلال","ضد انگل"]},{"id":"M-013","title":"بتامتازون","content":"نقطه ذوب حدود ۲۰۰°درجه سانتی‌گراد. فرم دی‌سدیم فسفات در آب محلول است؛ والرات، دی‌پروپیونات و استات در حلال‌های آلی محلول‌ترند؛ فرم پایه در آب بسیار کم‌محلول است. کورتیکواستروئید موضعی.","categories":["کورتیکواستروئید"]},{"id":"M-014","title":"اسید بوریک","content":"کریستال‌های شفاف/بی‌رنگ یا سفید، پودر دانه‌ای سفید، بی‌بو و جاذب رطوبت؛ نقطه ذوب ۱۷۱°درجه سانتی‌گراد. در گلیسیرین و آب جوش و الکل محلول است. سمی و برای مصرف خوراکی مناسب نیست. کاربرد: باکتریواستاتیک در شستشوی حفرات بدن مانند گوش و چشم و نیز بافر. ناسازگار با آب، بازهای قوی و گلیسیرین.","categories":["بافر","ضد باکتری"]},{"id":"M-015","title":"کالامین","content":"اکسید روی همراه با مقدار کمی اکسید آهن؛ پودر نرم و ریز صورتی، بی‌بو و بی‌مزه. در اسیدهای معدنی محلول و در آب نامحلول است. ضدخارش و قابض.","categories":["ضد خارش","قابض"]},{"id":"M-016","title":"کامفر","content":"پودر یا توده کریستالی سفید/بی‌رنگ با بوی نافذ و مزه تند معطر؛ در دمای اتاق به‌آرامی فرّار می‌شود. در روغن‌ها محلول، در آب کم‌محلول و در الکل نیز محلول است. قابل اشتعال. کاربرد: ضدخارش و ضد درد موضعی. ناسازگار با نمک‌ها.","categories":["ضد التهاب","نرم‌کننده"]},{"id":"M-017","title":"کربومرها / کاربوپول","content":"پودر سفید، سبک و جاذب رطوبت با بوی مشخص. به‌دلیل اتصال عرضی حل نمی‌شود، اما در آب و گلیسیرین متورم می‌شود و ژل می‌سازد. کاربرد: ژل‌کننده. ناسازگار با سدیم بنزوات، رزورسینول، فنول، الکترولیت‌ها و اسیدهای قوی.","categories":["ژل‌کننده","قوام‌دهنده"]},{"id":"M-018","title":"سدیم کربوکسی‌متیل‌سلولز","content":"پودر سفید گرانولی، بی‌بو و بی‌مزه. به‌راحتی در آب پخش می‌شود و محلول کلوئیدی شفاف ایجاد می‌کند. کاربردها: پایدارکننده، عامل معلق‌کننده، افزایش‌دهنده ویسکوزیته و ژل‌کننده؛ در فرآورده‌های خوراکی، موضعی و تزریقی. در متن منبع درباره محلولیت در اتانول ابهام وجود دارد و عبارت مربوط به «بیشترین ویسکوزیتی بین ۷ و ۹» نیز نیازمند بررسی با اصل منبع است. ناسازگار با اسیدهای قوی، صمغ زانتان، نمک‌های آهن/روی/آلومینیوم/جیوه و اتانول.","categories":["ژل‌کننده","قوام‌دهنده"]},{"id":"M-019","title":"روغن کرچک","content":"مایع شفاف، غلیظ، بی‌رنگ تا زرد کم‌رنگ با بوی ملایم. در اتانول، آب، گلیسیرین و پروپیلن گلایکول محلول است. با پارافین مایع بدون کمک روغن‌های گیاهی به‌خوبی پخش نمی‌شود. کاربرد: نرم‌کننده، حلال، عامل لویگیشن و پلاستی‌سایزر. غلظت ۵–۱۲.۵ در متن منبع بدون تعیین مبنا آمده است. ناسازگار با اکسیدکننده‌های قوی.","categories":["نرم‌کننده","حلال"]},{"id":"M-020","title":"کلرال هیدرات","content":"کریستال‌های شفاف/بی‌رنگ یا سفید با بوی آروماتیک نافذ؛ مزه تلخ و سوزان؛ نقطه ذوب ۵۷°درجه سانتی‌گراد. در آب محلول و در اتانول، گلیسیرین و روغن زیتون کمتر محلول است. کاربرد: خواب‌آور، آرام‌بخش و بیهوش‌کننده. ناسازگار با ترکیبات قلیایی.","categories":["سایر"]},{"id":"M-021","title":"کلرامفنیکل","content":"کریستال‌ها یا صفحات سفید تا خاکستری/زرد-سفید. در اتانول و پروپیلن گلایکول محلول و در آب کمی محلول است. آنتی‌بیوتیک و به نور ناپایدار است.","categories":["آنتی‌بیوتیک"]},{"id":"M-022","title":"کلسترول","content":"گرانول، پودر، سوزن یا صفحات مرواریدی سفید تا کمی زرد و تقریباً بی‌بو. در آب نامحلول و در اتانول کمی محلول؛ در اتانول گرم محلول‌تر است. در تماس با هوا و نور زرد/قهوه‌ای می‌شود. کاربرد: امولسیفایر و عامل جذب آب در پایه‌های پمادی. از نور محافظت شود.","categories":["امولسیفایر","پایه"]},{"id":"M-023","title":"سیتریک اسید / جوهر لیمو","content":"کریستال‌های شفاف و بی‌رنگ، بی‌بو با مزه تند اسیدی؛ فرم بی‌آب جاذب رطوبت است. در آب و تا حد کمتری در اتانول محلول است. کاربرد: کلاته‌کننده، نگهدارنده ضدمیکروبی، اسیدی‌کننده، بهبوددهنده طعم، آنتی‌اکسیدان و بافر. در برخی کاربردها برای حل کردن سنگ‌های کلیوی/ادراری ذکر شده است.","categories":["اسیدیفایر","بافر"]},{"id":"M-024","title":"کلیندامایسین","content":"هیدروکلراید: کریستالی، بی‌بو/با بوی خفیف، پایدار در نور و هوا، محلول در آب و کمتر در اتانول. فسفات: کریستالی سفید، بی‌بو، جاذب رطوبت، تلخ و محلول در آب؛ برای تزریقی و موضعی. پالمیتات هیدروکلراید: آمورف با بوی مشخص، محلول در آب و اتانول و مناسب محلول‌های خوراکی. آنتی‌بیوتیک.","categories":["آنتی‌بیوتیک","ضد آکنه"]},{"id":"M-025","title":"قطران زغال‌سنگ (کول تار)","content":"مایع یا نیمه‌جامد سیاه‌رنگ با بوی نافذ شبیه نفتالین و طعم سوزاننده/تیز. قابل اشتعال. در آب بسیار کم‌محلول؛ در بنزن محلول و در اتانول، کلروفرم و استون محلولیت کمتری دارد. در پایه اتانول/تویین تهیه می‌شود؛ آب باعث ایجاد کلوخه می‌شود. کاربردها: اگزما، پینه، ترک دست و پا و پسوریازیس. ناسازگار با لانولین. دور از نور و هوا نگهداری شود.","categories":["کراتولیتیک","ضد پسوریازیس","ضد اگزما"]},{"id":"M-026","title":"کلد کرم","content":"پایه کرمی سفید از نوع امولسیون آب در روغن (W/O). سفیدی آن به بوراکس نسبت داده شده است. شامل موم استر ستیل، موم سفید، روغن معدنی، بورات سدیم و آب تصفیه‌شده. کاربرد: پایه پمادی، نرم‌کننده و پاک‌کننده.","categories":["پایه","نرم‌کننده"]},{"id":"M-027","title":"کریستال ویوله","content":"همان جنتیان ویوله؛ پودر کریستالی سبز مایل به سیاه، بی‌بو با جلای فلزی و بسیار رنگ‌دهنده. متن منبع درباره محلولیت در الکل/گلیسیرین و آب عبارت مبهم دارد و باید با اصل منبع بررسی شود. کاربرد: ضد میکروبی.","categories":["آنتی‌بیوتیک"]},{"id":"M-028","title":"دگزامتازون","content":"پودر کریستالی سفید و بی‌بو؛ در اتانول محلول و در آب کمتر محلول است. دی‌سدیم فسفات به‌صورت کریستال سفید مایل به زرد، جاذب رطوبت، بسیار محلول در آب و کمتر در الکل است. کورتیکواستروئید.","categories":["کورتیکواستروئید"]},{"id":"M-029","title":"دکستروز / گلوکز","content":"کریستال‌های بی‌رنگ یا پودر/کریستال سفید، بی‌بو و شیرین؛ نقطه ذوب ۸۳°درجه سانتی‌گراد. در آب و گلیسیرین محلول و در اتانول کمتر محلول است. کاربرد: شیرین‌کننده، افزایش‌دهنده تونیسیتی و منبع کربوهیدرات تزریقی. ناسازگار با سیانوکوبالامین، کانامایسین، وارفارین و مواد قلیایی قوی.","categories":["منبع کربوهیدرات"]},{"id":"M-030","title":"دیلتیازم هیدروکلراید","content":"پودر یا کریستال‌های کوچک سفید، بی‌بو و تلخ؛ نقطه ذوب ۲۱۰°درجه سانتی‌گراد و حلالیت خوب در آب. کاربرد موضعی در فیشر و هموروئید. در ساختنی می‌توان از قرص‌های دیلتیازم نیز استفاده کرد.","categories":["ضد التهاب","ضد هموروئید","ضد شقاق"]},{"id":"M-031","title":"دیفن‌سیپرون","content":"پودر کریستالی سفید یا زرد کم‌رنگ با بوی نافذ. نقطه ذوب فرم مونوهیدرات حدود ۹۰ درجه سانتی‌گراد و فرم بی‌آب حدود ۱۲۰ درجه سانتی‌گراد. در استون محلول است. یک آلرژن تماسی است و در درمان زگیل و آلوپسی آره‌آتا کاربرد دارد. با عوامل کاهنده و اکسیدکننده‌های قوی ناسازگار است.","categories":["آلرژن تماسی","ضد زگیل","ریزش مو"]},{"id":"M-032","title":"دی‌سدیم هیدروژن فسفات","content":"کریستال یا گرانول سفید و بی‌بو؛ در آب محلول. در فرم‌های مونوهیدرات، دی‌هیدرات، هپتاهیدرات و دودکاهیدرات وجود دارد. منبع فسفات و مورد استفاده در «محلول ژولی». با آلکالوئیدها، آنتی‌پیرین، کلرال هیدرات، استات قلع، رزورسینول و برخی مواد دیگر ناسازگار است.","categories":["بافر","مکمل"]},{"id":"M-033","title":"دی‌متیل‌سولفوکساید","content":"مایع بی‌رنگ، جاذب رطوبت، با بوی سیر؛ طعم ابتدا تلخ و سپس شیرین. نقطه ذوب حدود ۱۸ درجه سانتی‌گراد. در آب محلول است و نسبتاً در الکل، استون و اتر محلولیت کمی دارد. تا حدود ۷۰٪ وزن خود می‌تواند آب جذب کند. حلال و افزاینده نفوذ پوستی است؛ بیشترین اثر نفوذی طبق منبع در غلظت ۶۰ تا ۸۰٪ ذکر شده است. کاربردهای ذکرشده شامل اسکلرودرمی، آمیلوئیدوز، سیستیت بینابینی و آرتریت روماتوئید است و اثر ضدالتهابی و بی‌حس‌کننده موضعی دارد.","categories":["حلال","افزاینده نفوذ پوستی","بی‌حس‌کننده موضعی","ضد التهاب"]},{"id":"M-034","title":"اریترومایسین","content":"پودر کریستالی سفید تا زرد کم‌رنگ و بی‌بو؛ در الکل محلول و در آب کمی محلول؛ نقطه ذوب حدود ۱۸۰°درجه سانتی‌گراد. آنتی‌بیوتیک و در فرآورده‌های موضعی، از جمله آکنه، کاربرد دارد. اتیل سوکسینات نقطه ذوب حدود ۱۰۹°درجه سانتی‌گراد دارد و برای سوسپانسیون/قرص استفاده می‌شود.","categories":["آنتی‌بیوتیک","ضد آکنه"]},{"id":"M-035","title":"استرادیول والرات","content":"پودر کریستالی سفید/کرم و بی‌بو، جاذب رطوبت؛ نقطه ذوب ۱۷۵°درجه سانتی‌گراد و در آب نامحلول. در الکل، روغن کرچک، روغن کنجد و بنزیل بنزوات محلول است. کاربرد ذکرشده: محرک رشد مو. از نور محافظت شود.","categories":["هورمون","ریزش مو"]},{"id":"M-036","title":"اتانول","content":"مایع شفاف، بی‌رنگ و فرّار با بوی مشخص و مزه سوزان؛ با آب و گلیسیرین امتزاج‌پذیر. کاربرد: حلال، نگهدارنده ضدمیکروبی و ضدعفونی‌کننده. متن منبع ناسازگاری با اکسیدکننده‌ها و قلیاها و ظروف آلومینیومی را در شرایط اسیدی ذکر می‌کند و عبارت آن نیازمند بررسی اصل منبع است.","categories":["حلال","ضدعفونی‌کننده"]},{"id":"M-037","title":"اوسرین","content":"پایه‌ای حاوی آب، استئاریل الکل، موم سفید و پارافین سفید. پایه جاذب آب و پوشاننده و از نوع امولسیون امولسیون آب در روغن (W/O) است.","categories":["پایه"]},{"id":"M-038","title":"کلودیون","content":"مایع غلیظ، شفاف، بی‌رنگ تا زرد کم‌رنگ و فرّار که در تماس با هوا فیلم سفید ایجاد می‌کند. شامل پیروکسیلین، اتر و الکل است. کلودیون انعطاف‌پذیر شامل کلودیون + کامفر + روغن کرچک است. پایه محافظ و پوشاننده موضعی و پایه فرآورده‌های کراتولیتیک زگیل/میخچه. قابل اشتعال.","categories":["ضدعفونی‌کننده","ضد قارچ","ضد باکتری"]},{"id":"M-039","title":"فرمالین / فرمالدهید","content":"محلول بی‌رنگ با بوی تند؛ در آب، الکل و استون محلول است. ضدعفونی‌کننده، ضدقارچ و ضدباکتری. ناسازگار با آمونیاک، آلکالوئیدها، تانن‌ها، نمک‌های مس/نقره/آهن، هیدروژن پراکساید، ید و پرمنگنات پتاسیم.","categories":["محافظ پوستی","پایه"]},{"id":"M-040","title":"ژلاتین","content":"جامد شکننده شیشه‌ای با رنگ کهربایی روشن تا زرد کم‌رنگ. در اتانول نامحلول و در گلیسیرین، اسیدها و بازها محلول است. آب جذب می‌کند؛ محلول آبی بالاتر از ۴۰°درجه سانتی‌گراد و با سرد شدن ژل ایجاد می‌کند. کاربرد: شیاف، ژل و افزایش‌دهنده ویسکوزیته. ناسازگار با آلدهیدها، کاتیون‌ها/آنیون‌ها و الکترولیت‌ها، یون‌های فلزی، سورفکتانت‌ها و اکسیدکننده‌های قوی.","categories":["ژل‌کننده","افزاینده ویسکوزیته","پایه"]},{"id":"M-041","title":"گلیسیرین / گلیسرول","content":"مایع شفاف، بی‌رنگ و شربتی با مزه شیرین و گرم؛ جاذب رطوبت؛ نقطه ذوب ۱۸°درجه سانتی‌گراد. با آب و الکل امتزاج‌پذیر و با روغن‌ها کمی محلول است. کاربرد: نرم‌کننده، مرطوب‌کننده، حلال/هم‌حلال در کرم، امولسیون و ژل، نگهدارنده ضدمیکروبی، شیرین‌کننده و افزایش‌دهنده ویسکوزیته. با حرارت تجزیه می‌شود و با اکسیدکننده‌های قوی مانند پتاسیم پرمنگنات می‌تواند واکنش خطرناک داشته باشد. در متن منبع: تا ۲۰٪ نگهدارنده/شیرین‌کننده، تا ۳۰٪ نرم‌کننده/مرطوب‌کننده، ژل آبی ۵–۱۵٪ و ژل غیرآبی ۵۰–۸۰٪.","categories":["مرطوب‌کننده","حلال","قوام‌دهنده"]},{"id":"M-042","title":"گلایکولیک اسید","content":"اسید آلی، کریستال‌های بی‌بو و جاذب رطوبت؛ نقطه ذوب ۸۰°درجه سانتی‌گراد. در آب، اتانول و اسید استیک محلول است. برای پوست و مخاط محرک است. کاربرد: مرطوب‌کننده و لایه‌بردار؛ در درصدهای پایین ضدلک/کک‌ومک و ضدچروک و در درصدهای بالا برای پیلینگ.","categories":["کراتولیتیک","مرطوب‌کننده","لایه‌بردار"]},{"id":"M-043","title":"هیدروکورتیزون / کورتیزول","content":"پودر کریستالی بی‌بو و تلخ؛ نقطه ذوب ۲۱۵°درجه سانتی‌گراد. در اتانول محلول، در پروپیلن گلایکول کمتر محلول و در آب کم‌محلول است. استات هیدروکورتیزون کریستالی، بی‌بو/بی‌مزه و جاذب رطوبت با نقطه ذوب حدود ۲۰۰°درجه سانتی‌گراد است و در اتانول محلول است؛ برای موضعی/گوشی/چشمی. سدیم سوکسینات آمورف و جاذب رطوبت، محلول در آب و اتانول و مناسب تزریقی است. کورتیکواستروئید. ناسازگار با کلسـی‌پوتریول.","categories":["کورتیکواستروئید"]},{"id":"M-044","title":"هیدروژن پراکساید","content":"اکسیدکننده قوی و خورنده؛ غلظت ۳۰٪ می‌تواند پوست و مخاط را بسوزاند. محلول ۳٪ بی‌رنگ و روان با مزه تلخ و بوی کم یا بدون بو است و در آب محلول است. کاربرد: ضدعفونی بافت/سطوح و قطره گوشی برای خارج کردن موم گوش. محلول ۶٪ با ۳ حجم آب رقیق می‌شود. به‌تدریج تجزیه می‌شود. ناسازگار با آمونیاک، فنول، زغال فعال، کلریدها، سیترات‌های قلیایی، نمک‌های آهن/جیوه/طلا، تنتورها، سولفیت‌ها، پرمنگنات‌ها و یدیدها.","categories":["اکسیدکننده","ضدعفونی‌کننده"]},{"id":"M-045","title":"هیدروکینون","content":"کریستال‌های سوزنی یا پودر سفید/بی‌رنگ؛ نقطه ذوب ۱۷۰°درجه سانتی‌گراد. در الکل محلول و در آب کمتر محلول است. در نور و هوا تیره می‌شود؛ از ابزار فلزی استفاده نشود. کاربرد: روشن‌کننده پوست و درمان هایپرپیگمانتاسیون، کک‌ومک، ملاسما و لک پس از التهاب؛ در برخی فرمول‌ها با غلظت کمتر از ۱٪ آنتی‌اکسیدان. ناسازگار با اکسیدکننده‌ها، نمک‌های آهن و قلیاها. از نور محافظت شود.","categories":["ضد لک","آنتی‌اکسیدان"]},{"id":"M-046","title":"ایکتیول / ایکتامول","content":"مایع یا نیمه‌جامد غلیظ سیاه با بوی قوی. در آب، گلیسیرین و روغن‌های ثابت محلول و در الکل/اتر نسبتاً محلول است. کاربرد: نرم‌کننده، آرام‌کننده پوست و ضدعفونی‌کننده.","categories":["ضد التهاب","ضد عفونی‌کننده"]},{"id":"M-047","title":"ید","content":"گرانول/فلیک/پلت سیاه یا خاکستری مایل به آبی با جلای فلزی و مزه قابض؛ نقطه ذوب ۱۱۳°درجه سانتی‌گراد. در دمای اتاق تصعید شده و بخار بنفش خورنده ایجاد می‌کند. در الکل و تا حدی گلیسیرین محلول و در آب نامحلول است. رنگ آن با تیوسولفات سدیم یا الکل آمونیاکی حذف می‌شود. کاربرد: ضدعفونی‌کننده موضعی و درمان پرکاری تیروئید. ناسازگار با تانن‌ها، نشاسته و آلکالوئیدها.","categories":["ضدعفونی‌کننده","قابض"]},{"id":"M-048","title":"ایزوپروپیل الکل","content":"مایع شفاف، بی‌رنگ، فرّار و قابل اشتعال با بوی ملایم و مزه تلخ. در آب و الکل محلول و در محلول‌های نمکی نامحلول است. از اتانول سمی‌تر و خوراکی نیست. کاربرد: حلال و ضدعفونی‌کننده، به‌ویژه ۷۰٪. ناسازگار با اکسیدکننده‌هایی مانند اکسید روی و هیدروژن پراکساید. نمک باعث خروج ایزوپروپیل الکل از محلول می‌شود.","categories":["حلال","ضدعفونی‌کننده"]},{"id":"M-049","title":"کتوکونازول","content":"کریستال‌های سفید تا بژ، بی‌بو؛ نقطه ذوب ۱۴۶°درجه سانتی‌گراد. در آب نامحلول و در اتانول کمی محلول است. ضدقارچ، کمک به کنترل شوره و طبق متن منبع محرک رشد مو.","categories":["ضد قارچ","ضد شوره"]},{"id":"M-050","title":"لاکتیک اسید","content":"مایعی شربتی، بی‌رنگ تا زرد کم‌رنگ، غیرفرار و جاذب رطوبت، بی‌بو. نقطه ذوب حدود ۱۷ درجه سانتی‌گراد. در آب و اتانول محلول است. کاربردها: نرم‌کننده و بهبوددهنده وضعیت پوست؛ در غلظت‌های بالا به‌عنوان کراتولیتیک قوی برای زگیل. با اکسیدکننده‌ها مانند یدید و اسید نیتریک ناسازگار است.","categories":["کراتولیتیک","مرطوب‌کننده","لایه‌بردار"]},{"id":"M-051","title":"لانولین","content":"ماده نیمه‌جامد، غلیظ، چسبناک و نیمه‌شفاف زردرنگ با بوی پشم. نقطه ذوب حدود ۴۰ درجه سانتی‌گراد. در الکل گرم محلول و در آب نامحلول است و می‌تواند تا حدود دو برابر وزن خود آب جذب کند. کاربردها: پایه پمادی جاذب، پایه آب‌دوست/جاذب از نوع امولسیون آب در روغن و نرم‌کننده. در دمای بالا ممکن است تغییر رنگ دهد.","categories":["پایه","نرم‌کننده"]},{"id":"M-052","title":"منیزیم کلراید","content":"پودر کریستالی یا قطعات نازک بی‌رنگ و بی‌بو؛ نقطه ذوب فرم بی‌آب ۷۱۲°درجه سانتی‌گراد و فرم هیدراته ۱۱۸°درجه سانتی‌گراد. در آب محلول است. کاربرد: ملین و تأمین منیزیم.","categories":["ملین"]},{"id":"M-053","title":"منیزیم سیترات","content":"پودر/گرانول کریستالی سفید، بی‌بو و ترش. فرم دی‌بازیک در آب کم‌محلول و حلالیت آن با اسید سیتریک یا نمک‌های قلیایی افزایش می‌یابد؛ فرم تری‌بازیک در آب حدود ۱ به ۵ محلول است. محلول آن شفاف و بی‌رنگ تا زرد کم‌رنگ با مزه لیمویی شیرین-ترش است. ملین و منبع منیزیم/سیترات.","categories":["ملین"]},{"id":"M-054","title":"منیزیم سولفات","content":"پودر کریستالی بی‌رنگ با مزه تلخ، شور و خنک‌کننده؛ نقطه ذوب ۲۵۰°درجه سانتی‌گراد. در آب، به‌ویژه آب داغ، محلول و در گلیسیرین/اتانول کمی محلول است. کاربرد: ملین و تأمین منیزیم. ناسازگار با هیدروکسیدهای قلیایی، سالیسیلات‌ها، تارتارات‌ها، فسفات‌ها و برخی یون‌های فلزی.","categories":["ملین"]},{"id":"M-055","title":"منتول","content":"«کافور نعناع»؛ پودر، توده یا سوزن‌های کریستالی بی‌رنگ با بوی مطبوع نعناع. در اسید استیک و روغن‌های معدنی/فرّار/غیرفرّار و الکل محلول و در آب کمی محلول است. کاربرد: طعم‌دهنده و عطر، ایجاد حس خنکی، گشادکننده عروق، ضد درد و ضدخارش. با کامفر، فنول، کلرال هیدرات، رزورسینول، تیمول و پتاسیم پرمنگنات می‌تواند ناسازگار باشد.","categories":["ضد خارش","مسکن موضعی"]},{"id":"M-056","title":"متوکسالن","content":"کریستال‌های سفید/کرم سوزنی یا مویی؛ مزه تلخ/گزگزکننده؛ نقطه ذوب ۱۴۸°درجه سانتی‌گراد. در پروپیلن گلایکول، اسید استیک و اتانول جوشان محلول و در آب نامحلول و در آب گرم کمی محلول است. از تماس پودر با پوست پرهیز شود. کاربرد: ایجاد پیگمان در ویتیلیگو همراه فتوتراپی. ناسازگار با نیترات‌ها و اکسیدکننده‌ها. از نور محافظت شود.","categories":["پیگمانت‌ساز"]},{"id":"M-057","title":"متیلن بلو","content":"کریستال یا پودر سبز تیره تا سیاه، بی‌بو با جلای فلزی و جاذب رطوبت. محلول آبی/اتانولی آبی‌رنگ است؛ نقطه ذوب ۱۹۰°درجه سانتی‌گراد. حدوداً در آب ۱:۲۵ و در الکل ۱:۶۵ محلول است. ضدعفونی‌کننده. ناسازگار با یدید، دی‌کرومات و اکسیدکننده‌ها.","categories":["ضدعفونی‌کننده"]},{"id":"M-058","title":"متیل پارابن","content":"کریستال‌های سفید/بی‌رنگ، بی‌بو با مزه تند؛ نقطه ذوب ۱۲۸°درجه سانتی‌گراد. در اتانول محلول، در گلیسیرین کمتر و در آب نامحلول است. نگهدارنده ضدمیکروبی؛ اثر آن با ۲–۵٪ پروپیلن گلایکول افزایش می‌یابد و علیه قارچ‌ها مؤثرتر از باکتری‌هاست. ناسازگار با سورفکتانت‌های غیریونی مانند تویین؛ با آهن تغییر رنگ می‌دهد؛ ناسازگار با اسیدهای قوی و بازهای ضعیف.","categories":["سایر"]},{"id":"M-059","title":"مترونیدازول","content":"کریستال‌های سفید تا زرد کم‌رنگ، بی‌بو؛ نقطه ذوب ۱۶۰°درجه سانتی‌گراد. در آب کمی و در الکل کمتر محلول است. ضدپروتوزوا، ضدآمیب و ضدباکتری؛ در روزاسه کاربرد دارد. از نور محافظت شود.","categories":["ضد باکتری","ضد پروتوزوآ","ضد روزاسه"]},{"id":"M-060","title":"ماینوکسیدیل","content":"کریستال‌های سفید؛ نقطه ذوب ۲۵۰°درجه سانتی‌گراد. در اتانول، پروپیلن گلایکول و ایزوپروپیل الکل محلول و در آب کمی محلول است. کاربرد: آلوپسی. به نور حساس است و زرد می‌شود.","categories":["ریزش مو"]},{"id":"M-061","title":"مونوبنزون","content":"پودر کریستالی سفید و بی‌بو؛ نقطه ذوب ۱۲۰°درجه سانتی‌گراد. در اتانول محلول و در آب نامحلول است. عامل بی‌رنگ‌کننده که در تشکیل ملانین اختلال ایجاد می‌کند؛ کاربرد در ویتیلیگو. ممکن است پوست را تحریک کند.","categories":["ضد لک"]},{"id":"M-062","title":"روغن زیتون","content":"مایع روغنی شفاف و بی‌رنگ تا زرد. در اتانول محلول است. کاربردها: عامل لوژیکیشن، وسیله روغنی و حلال؛ همچنین برای نرم‌کردن جرم گوش. با هیدروکسیدهای قلیایی و اکسیدکننده‌ها ناسازگار است. دور از نور نگهداری شود.","categories":["حلال","نرم‌کننده"]},{"id":"M-063","title":"پاراآمینوبنزوئیک اسید (PABA)","content":"کریستال‌های سفید تا زرد کم‌رنگ و بی‌بو. در اتانول و محلول‌های قلیایی هیدروکسید/کربنات محلول و در آب کمی محلول است. در هوا/نور تغییر رنگ می‌دهد. اثر ضدآفتاب دارد و در متن منبع کاربرد خوراکی در ویتیلیگو، اسکلرودرمی و بیماری پیرونی ذکر شده است. ناسازگار با آهن و اکسیدکننده‌ها. از نور محافظت شود.","categories":["ضد آفتاب"]},{"id":"M-064","title":"پارافین مایع / روغن مینرال","content":"مایع روغنی شفاف، بی‌رنگ و نسبتاً ویسکوز. در روغن‌ها امتزاج‌پذیر و در آب، گلیسیرین و اتانول نامحلول است. کاربردها: نرم‌کننده، لوبریکانت، وسیله روغنی و حلال. با اکسیدکننده‌های قوی ناسازگار است.","categories":["نرم‌کننده","لوبریکانت","حلال"]},{"id":"M-065","title":"فنول","content":"کریستال‌های سوزنی بی‌رنگ یا توده‌های کریستالی سفید تا صورتی روشن با بوی مشخص و مزه سوزان/تند/قابض؛ نقطه ذوب ۴۳°درجه سانتی‌گراد. در اتانول، گلیسیرین و روغن محلول؛ در آب و پارافین مایع کمی محلول است. سمی، خورنده و بسیار محرک. کاربرد: نگهدارنده ضدمیکروبی، ضدعفونی‌کننده، بی‌حس‌کننده و ضدخارش. ناسازگار با نمک‌های آهن و ید رقیق. از نور محافظت شود.","categories":["ضدعفونی‌کننده","بی‌حس‌کننده","ضد خارش","قابض"]},{"id":"M-066","title":"فسفریک اسید","content":"مایع غلیظ شربتی، بی‌رنگ و بی‌بو؛ در آب و الکل محلول. کاربرد: بافر، اسیدی‌کننده و ماده فعال در محلول ژولی. ناسازگار با ترکیبات قلیایی.","categories":["بافر","اسیدیفایر"]},{"id":"M-067","title":"پودوفیلین","content":"پودر زرد مایل به قهوه‌ای که در نور تیره می‌شود؛ نقطه ذوب ۱۱۵°درجه سانتی‌گراد. در اتانول محلول. سوزاننده و محرک. اثر آنتی‌میتوتیک و سوزاننده در زگیل‌های تناسلی/مقعدی. ناسازگار با اکسیدکننده‌ها و حرارت. از نور محافظت شود.","categories":["ضد زگیل","کراتولیتیک"]},{"id":"M-068","title":"پتاسیم سیترات","content":"پودر دانه‌ای سفید با کریستال‌های شفاف، بی‌بو و با مزه خنک/شور؛ فرم مونوهیدرات جاذب رطوبت؛ نقطه ذوب ۲۳۰°درجه سانتی‌گراد. در آب و گلیسیرین محلول و در الکل کمی محلول است. بافر، تأمین‌کننده بی‌کربنات و قلیایی‌کننده سیستمیک برای کمک به حل سنگ‌های کلیوی/ادراری. ناسازگار با کلسیم و اکسیدکننده‌های قوی.","categories":["قلیایی‌کننده سیستمیک","بافر","سنگ ادراری"]},{"id":"M-069","title":"پتاسیم یدید","content":"پودر دانه‌ای سفید یا کریستال‌های چندوجهی، تا حدی جاذب رطوبت؛ نقطه ذوب ۶۸۰°درجه سانتی‌گراد. در آب و گلیسیرین محلول و در الکل کمتر محلول است. محلول آبی به‌تدریج با اکسیداسیون قهوه‌ای می‌شود. کاربرد: ضدقارچ، خلط‌آور، علائم تنفسی و تأمین ید؛ در محلول لوگول و به‌صورت خوراکی. برای پوشاندن مزه از شربت ساده/دارچین/شیرین‌بیان/الگزیر معطر ذکر شده است. ناسازگار با نمک آلکالوئیدها، کلرال هیدرات، اسید تارتاریک، پتاسیم کلرات و نمک‌های فلزی.","categories":["ضد قارچ","خلط‌آور"]},{"id":"M-070","title":"پتاسیم پرمنگنات","content":"کریستال‌های بنفش با جلای فلزی، بی‌بو و با مزه شیرین/قابض؛ نقطه ذوب ۲۴۰°درجه سانتی‌گراد. در آب محلول و اکسیدکننده قوی است. با مواد قابل اکسید شدن می‌تواند انفجار ایجاد کند. کاربرد: ضدعفونی‌کننده موضعی. ناسازگار با الکل، اسید هیدروکلریک، نمک‌های جیوه/آهن، یدید، برومید و پراکسیدها.","categories":["ضدعفونی‌کننده","اکسیدکننده","قابض"]},{"id":"M-071","title":"پروژسترون","content":"پودر کریستالی سفید تا کرم و بی‌بو؛ نقطه ذوب ۱۲۵°درجه سانتی‌گراد. در الکل محلول و در آب نامحلول است. هورمون جنسی زنانه؛ در متن منبع مهار تستوسترون و کاربرد در آلوپسی آندروژنیک ذکر شده است. از نور محافظت شود.","categories":["هورمون"]},{"id":"M-072","title":"پروپیلن گلایکول","content":"مایع شفاف، بی‌رنگ، ویسکوز، جاذب رطوبت و بی‌بو با مزه شیرین شبیه گلیسیرین. با آب، الکل و گلیسیرین امتزاج‌پذیر و با روغن‌ها عموماً امتزاج‌ناپذیر است. نگهدارنده ضدمیکروبی ۱۵–۳۰٪، ضدعفونی‌کننده، مرطوب‌کننده حدود ۱۵٪ و حلال/هم‌حلال در فرآورده‌های موضعی و خوراکی. برای کورتیکواستروئیدها، فنول، ویتامین‌ها، بی‌حس‌کننده‌های موضعی و آلکالوئیدها حلال بهتری از گلیسیرین است. ناسازگار با اکسیدکننده‌ها مانند پتاسیم پرمنگنات. از نور محافظت شود.","categories":["حلال","مرطوب‌کننده","ضدعفونی‌کننده"]},{"id":"M-073","title":"پروپیل پارابن","content":"پودر کریستالی سفید، بی‌بو و بی‌مزه؛ نقطه ذوب ۹۷°درجه سانتی‌گراد. در اتانول و پروپیلن گلایکول محلول، در گلیسیرین کمتر و در آب نامحلول است. نگهدارنده ضدمیکروبی ۰.۰۱–۰.۶٪. ناسازگار با سورفکتانت‌های غیریونی، آهن، اسیدهای قوی و بازهای ضعیف.","categories":["سایر"]},{"id":"M-074","title":"رزورسینول","content":"پودر/کریستال سفید با بوی ملایم مشخص و مزه شیرین/تلخ؛ نقطه ذوب ۱۱۰°درجه سانتی‌گراد. در آب، اتانول و گلیسیرین بسیار محلول است. در نور و هوا تغییر رنگ می‌دهد. کراتولیتیک در آکنه، اگزما، پسوریازیس و درماتیت سبوره‌ای. ناسازگار با لانولین. از نور محافظت شود.","categories":["کراتولیتیک","ضد آکنه","ضد سبوره"]},{"id":"M-075","title":"ریوانول","content":"کریستال‌های زرد کم‌رنگ با مزه تلخ و قابض؛ نقطه ذوب ۲۳۵°درجه سانتی‌گراد. در آب محلول و در الکل کمتر محلول است. ضدعفونی‌کننده. ناسازگار با اکسیدکننده‌ها.","categories":["ضدعفونی‌کننده","قابض"]},{"id":"M-076","title":"سالیسیلیک اسید","content":"کریستال‌های سوزنی یا پودر نرم سفید؛ مزه ناخوشایند با پس‌مزه شیرین و تحریک زبان؛ نقطه ذوب ۱۵۹°درجه سانتی‌گراد و در ۷۶°درجه سانتی‌گراد تصعید می‌شود. در الکل و آب جوش محلول و در آب کمی محلول است. در نور خورشید تغییر رنگ می‌دهد. کراتولیتیک. ناسازگار با نمک‌های آهن، ید، کلسـی‌پوتریول و موپیروسین. از نور محافظت شود.","categories":["کراتولیتیک"]},{"id":"M-077","title":"نقره نیترات","content":"کریستال‌های سفید/بی‌رنگ و شفاف، بی‌بو با مزه فلزی و تلخ؛ نقطه ذوب ۲۱۲°درجه سانتی‌گراد. در آب و الکل محلول. در نور و در تماس با مواد آلی تغییر رنگ می‌دهد. ضدعفونی‌کننده و قابض. متن منبع ناسازگاری با «الکان» را ذکر کرده که عبارت آن مبهم است؛ همچنین با یدید، کربنات، نمک‌های فلزی، کلرید، فسفات و اسید تانیک ناسازگار است. از نور محافظت شود.","categories":["ضدعفونی‌کننده","قابض"]},{"id":"M-078","title":"سدیم بنزوات","content":"پودر کریستالی/دانه‌ای سفید و بی‌بو با مزه شور-شیرین ناخوشایند؛ جاذب رطوبت؛ نقطه ذوب ۳۰۰°درجه سانتی‌گراد. در آب محلول و در الکل کمی محلول است. نگهدارنده ضدمیکروبی و ضدقارچ: خوراکی ۰.۰۲–۰.۵٪، موضعی ۰.۱–۰.۵٪ و تزریقی ۰.۵٪. مزیت: پوشش pH وسیع‌تر و حلالیت بهتر؛ ممکن است مزه فرآورده خوراکی را بدتر کند. ناسازگار با ژلاتین، نمک‌های فلزی و کلسیم؛ اثر ضدمیکروبی با سورفکتانت‌های غیریونی و کائولن کاهش می‌یابد.","categories":["ضد قارچ","ضد باکتری"]},{"id":"M-079","title":"سدیم بیکربنات","content":"پودر دانه‌ای/کریستالی سفید با مزه شور و کمی قلیایی؛ در رطوبت به‌تدریج تجزیه می‌شود؛ نقطه ذوب ۲۷۰°درجه سانتی‌گراد. در آب محلول و در الکل نامحلول است و با هوا و گرما تجزیه می‌شود. کاربرد: قلیایی‌کننده و فرآورده‌های افورسانت، آنتی‌اسید و تأمین بی‌کربنات در اسیدوز متابولیک. دهانشویه ۳۰ گرم در لیتر برای کاهش درد و التهاب ضایعات دهانی مانند آفت ذکر شده است. ناسازگار با نمک‌های اسیدی، اسیدها و قلیاها؛ با سالیسیلات‌ها موجب تیرگی می‌شود. محلول آن با سیپروفلوکساسین، لووفلوکساسین و آمیودارون ناسازگار است.","categories":["قلیایی‌کننده","ضد اسید","فراورده‌های جوشان"]},{"id":"M-080","title":"سدیم کلراید","content":"نمک خوراکی؛ پودر کریستالی سفید یا کریستال‌های مکعبی بی‌رنگ با طعم شور. نقطه ذوب حدود ۸۰۴ درجه سانتی‌گراد. در آب محلول، در گلیسیرین کمتر محلول و در الکل بسیار کم‌محلول است. در غلظت ۳٪ به‌عنوان مرطوب‌کننده مطرح شده است؛ طبق یادداشت کاربر، ۳٪ بهترین خاصیت مرطوب‌کنندگی را دارد و غلظت‌های بالاتر می‌توانند باعث خشکی پوست شوند. با آهن، نمک‌های فلزی و اکسیدکننده‌های قوی ناسازگار است.","categories":["مرطوب‌کننده"]},{"id":"M-081","title":"سدیم سیترات","content":"کریستال‌های بی‌رنگ یا پودر کریستالی بی‌بو با مزه شور و خنک؛ نقطه ذوب ۳۰۰°درجه سانتی‌گراد. در آب محلول و در الکل نامحلول است. قلیایی‌کننده، بافر، امولسیفایر و ضدانعقاد. فرم بی‌آب در قرص‌های افورسانت. در متن منبع برای کاهش درد/التهاب سیستیت و در دهیدراتاسیون/اسیدوز ناشی از اسهال و نیز قلیایی کردن ادرار و پیشگیری از سنگ‌های کلیوی/ادراری ذکر شده است. ناسازگار با اسیدها، اکسیدکننده/احیاکننده‌ها و کلسیم.","categories":["قلیایی‌کننده","بافر","سنگ ادراری","امولسیفایر"]},{"id":"M-082","title":"سدیم متابی‌سولفیت","content":"کریستال‌های سفید یا پودر کریستالی زردرنگ با بوی گوگردی و طعم اسیدی/شور. نقطه ذوب کمتر از ۱۵۰ درجه سانتی‌گراد. در آب و گلیسیرین محلول و در الکل نامحلول است. آنتی‌اکسیدان و نگهدارنده ضد میکروبی در غلظت ۰٫۰۱ تا ۱٪. با سمپاتومیمتیک‌ها به‌ویژه اپی‌نفرین و نیز کلرامفنیکل ناسازگار است. برای کاهش تماس با هوا، ظرف تا حد امکان پر نگه داشته شود.","categories":["آنتی‌اکسیدان"]},{"id":"M-083","title":"سدیم تیوسولفات","content":"گرانول/پودر کریستالی یا کریستال‌های بی‌رنگ، بی‌بو؛ ممکن است رطوبت جذب یا از دست بدهد؛ نقطه ذوب ۴۸°درجه سانتی‌گراد. در آب محلول و در الکل نامحلول است. آنتی‌اکسیدان، ضدقارچ و پادزهر مسمومیت با سیانید. ناسازگار با حرارت، ید، اسیدها و نمک‌های سرب/جیوه/نقره.","categories":["آنتی‌اکسیدان","ضد قارچ"]},{"id":"M-084","title":"ساکاروز / شکر","content":"کریستال‌های بی‌رنگ یا پودر کریستالی سفید، شیرین و بی‌بو؛ نقطه ذوب ۱۷۰°درجه سانتی‌گراد. در آب محلول است. شیرین‌کننده و افزایش‌دهنده ویسکوزیته. ناسازگار با اسیدهای رقیق/غلیظ و طبق متن منبع با ظروف آلومینیومی مشکل دارد.","categories":["قوام‌دهنده"]},{"id":"M-085","title":"سدیم سولفاستامید","content":"پودر کریستالی سفید، بی‌بو و تلخ؛ نقطه ذوب ۲۵۷°درجه سانتی‌گراد. در آب محلول و در الکل کمی محلول است. فرم پایه در الکل، اسیدهای معدنی رقیق و محلول KOH/NaOH محلول و در آب کمی محلول است. به نور و شرایط بسیار اسیدی/قلیایی حساس. آنتی‌باکتریال از گروه سولفونامیدها. ناسازگار با فرآورده‌های نقره و سولفات روی. در ظرف مقاوم به نور نگهداری شود.","categories":["آنتی‌بیوتیک"]},{"id":"M-086","title":"گوگرد پرسیپیته","content":"سه نوع گوگرد ذکر شده: پرسیپیته، شسته‌شده و تصعیدی. پودر زرد میکروکریستالی/آمورف، نرم، بی‌مزه و بی‌بو یا با بوی خفیف گوگرد؛ نقطه ذوب ۱۱۵°درجه سانتی‌گراد. در آب نامحلول و در الکل و روغن زیتون کمی محلول است. لویگیشن بهتر با الکل، گلیسیرین یا تری‌اتانول‌آمین اولئات انجام می‌شود. در غلظت‌های بالا کراتولیتیک، همچنین ضدقارچ و ضدگال. ناسازگار با فلزات به‌ویژه نقره و مس؛ برای تهیه و نگهداری از ابزار فلزی استفاده نشود. ناسازگار با هیدروکینون، رزورسینول، بنزویل پروکساید، ایزوترتینوئین و مواد لایه‌بردار مانند سالیسیلیک اسید.","categories":["کراتولیتیک","ضد قارچ","ضد گال"]},{"id":"M-087","title":"تانیک اسید / تانن","content":"پودر آمورف زرد-قهوه‌ای، بی‌بو یا با بوی خفیف و قابض؛ در نور و هوا تیره می‌شود؛ نقطه ذوب ۲۱۰°درجه سانتی‌گراد. در آب، گلیسیرین و اتانول محلول است. ناسازگار با اکسیدکننده‌ها و آلکالوئیدها. در ظرف مقاوم به نور نگهداری شود.","categories":["قابض"]},{"id":"M-088","title":"تیتانیوم دی‌اکساید","content":"پودر آمورف سفید، غیرجاذب رطوبت، بی‌مزه و بی‌بو. نقطه ذوب حدود ۱۸۵۵ درجه سانتی‌گراد. در آب، حلال‌های معدنی، اسید نیتریک، اسید هیدروکلریک و اسید سولفوریک رقیق نامحلول است و در اسید هیدروفلوئوریک و اسید سولفوریک داغ محلول می‌شود. کاربردها: پیگمنت و مات‌کننده، به‌ویژه در فرآورده‌های ضدآفتاب. با لیپیدهای غیراشباع ناسازگار است. در ظرف مقاوم به نور نگهداری شود.","categories":["مات‌کننده","ضد آفتاب"]},{"id":"M-089","title":"ترتینوئین","content":"پودر کریستالی زرد؛ متن منبع بوی خاص گل‌مانند ذکر می‌کند؛ نقطه ذوب ۱۸۰°درجه سانتی‌گراد. در روغن کرچک و زیتون محلول است. عبارت منبع درباره محلولیت در الکل/آب/گلیسیرین مبهم است و باید با اصل منبع بررسی شود. کاربرد: کراتولیتیک ضدآکنه و درمان پوست آسیب‌دیده. به نور، هوا و حرارت حساس و با بنزوئیل پروکساید ناسازگار است. از نور محافظت شود.","categories":["رتینوئید","ضد آکنه","کراتولیتیک"]},{"id":"M-090","title":"اسید تری‌کلرو استیک","content":"کریستال‌های بی‌رنگ، جاذب رطوبت و شونده، با بوی نافذ. نقطه ذوب حدود ۵۸ درجه سانتی‌گراد. در آب، الکل و اتر محلول است. خورنده و تحریک‌کننده پوست و مجاری تنفسی. کاربردها: درمان زگیل تناسلی، برداشتن تاتو و لایه‌برداری. با آهن، روی و آلومینیوم ناسازگار است.","categories":["کراتولیتیک","لایه‌بردار","ضد زگیل"]},{"id":"M-091","title":"تویین ۸۰ / پلی‌سوربات ۸۰","content":"مایع روغنی زرد لیمویی تا کهربایی با طعم تلخ و بوی گرم؛ در آب و اتانول محلول و در روغن مینرال نامحلول است. یک سورفکتانت غیریونی است. کاربردها: امولسیفایر در حدود ۱ تا ۱۵٪ و عامل ترکننده/افزاینده حلالیت در حدود ۱ تا ۱۵٪. با فنول، تانن، متیل‌پارابن و اسیدها و بازهای قوی ناسازگار است.","categories":["امولسیفایر","عامل ترکننده","افزاینده حلالیت"]},{"id":"M-092","title":"اوره","content":"پودر کریستالی سفید، بی‌بو و با مزه شور ناخوشایند؛ نقطه ذوب ۱۳۳°درجه سانتی‌گراد. در آب محلول و در اتانول کمتر محلول است. کاربرد: مرطوب‌کننده و کراتولیتیک؛ ۱–۱۲٪ مرطوب‌کننده و ۱۲–۴۰٪ کراتولیتیک. ناسازگار با عوامل احیاکننده و فلزات.","categories":["مرطوب‌کننده","کراتولیتیک"]},{"id":"M-093","title":"وازلین / پارافین / پترولاتوم","content":"سفید تا زرد، بی‌مزه و بی‌بو؛ شفاف با فلورسانس خفیف؛ نقطه ذوب ۴۵°درجه سانتی‌گراد. در آب کاملاً نامحلول و در بیشتر روغن‌ها محلول است. عبارت منبع درباره محلولیت در الکل/گلیسیرین مبهم است. کاربرد: نرم‌کننده و پایه پمادی؛ پایه پوشاننده در کرم‌های نرم‌کننده ۱۰–۳۰٪ و در امولسیون‌های موضعی ۴–۲۵٪. از نور محافظت شود.","categories":["پایه","نرم‌کننده","محافظ پوست"]},{"id":"M-094","title":"ویتامین E / توکوفرول","content":"مایع روغنی شفاف و ویسکوز، بی‌رنگ تا زرد-قهوه‌ای. در اتانول و روغن‌های فرّار محلول و در آب نامحلول است. آنتی‌اکسیدان محلول در چربی؛ برای حلال‌های آب‌گریز ۰.۰۰۱–۰.۰۵٪. سورفکتانت غیریونی. ناسازگار با هوا، نمک‌های نقره/آهن، پراکسیدها و یون‌های فلزی. توسط پلاستیک‌ها جذب می‌شود. از نور محافظت شود.","categories":["آنتی‌اکسیدان"]},{"id":"M-095","title":"آب مقطر / آب تصفیه‌شده (DW)","content":"مایع شفاف، بی‌بو و بی‌مزه. برای فرمولاسیون از آب مقطر، اسمز معکوس یا دی‌یونیزه استفاده شود. نقطه ذوب ۰°درجه سانتی‌گراد. با بیشتر حلال‌های قطبی امتزاج‌پذیر و حلال است. ناسازگار با فلزات قلیایی/قلیایی خاکی و اکسیدهای آن‌ها.","categories":["حلال"]},{"id":"M-096","title":"صمغ زانتان","content":"پودر نرم سفید تا کرم‌رنگ، بی‌بو. در آب محلول و در الکل نامحلول است. کاربردها: عامل معلق‌کننده، افزایش‌دهنده ویسکوزیته و تشکیل‌دهنده ژل در فرآورده‌های خوراکی و موضعی. با اکسیدکننده‌ها، سدیم کربوکسی‌متیل‌سلولز، وراپامیل، آمی‌تریپتیلین و تاموکسیفن ناسازگار است؛ همچنین با سورفکتانت‌های کاتیونی و برخی پلیمرها، نگهدارنده‌ها و سورفکتانت‌های آنیونی/آمفوتریک در غلظت‌های بالا و یون‌های چندظرفیتی ناسازگاری دارد.","categories":["ژل‌کننده","قوام‌دهنده"]},{"id":"M-097","title":"زینک اکساید","content":"پودر نرم آمورف سفید تا سفید مایل به زرد و بی‌بو؛ نقطه ذوب ۱۹۸۵°درجه سانتی‌گراد. در اسیدهای رقیق محلول و در آب و الکل نامحلول است. ضدعفونی‌کننده، قابض، محافظ پوست و ضدآفتاب فیزیکی. گلیسیرین موجب سیاه شدن آن می‌شود. ناسازگار با لیپیدهای غیراشباع و بنزالکونیوم کلراید.","categories":["محافظ پوست","قابض","ضدعفونی‌کننده","ضد آفتاب"]},{"id":"M-098","title":"زینک سولفات","content":"هپتاهیدرات: پودر/گرانول/کریستال بی‌رنگ و قابض؛ مونوهیدرات: پودر/گرانول/کریستال سفید. بی‌بو و مستعد از دست دادن آب؛ نقطه ذوب ۱۰۰°درجه سانتی‌گراد. در آب و گلیسیرین محلول و در الکل نامحلول است. کاربرد: قابض موضعی و منبع روی خوراکی. ناسازگار با بنزالکونیوم کلراید، نمک‌های کلرهگزیدین و پروپیل گالات.","categories":["قابض","مکمل"]},{"id":"M-099","title":"نیکوتینیک اسید (Nicotinic Acid / Niacin)","content":"نام‌های دیگر: Niacin؛ Vitamin B3؛ Nicotinic acid\n\nفرمول مولکولی: C₆H₅NO₂\nوزن مولکولی: 123.11 g/mol\n\nویژگی‌های ظاهری: پودر یا کریستال سفید تا سفید مایل به زرد، معمولاً بی‌بو.\n\nمحلولیت: در آب محلولیت نسبتاً کمی دارد؛ در آب جوش محلول‌تر است. در الکل نیز حلالیت محدودی دارد. برای تهیه محلول‌های موضعی باید به حلالیت آن توجه شود.\n\nکاربردها: منبع ویتامین B3 و پیش‌ساز کوآنزیم‌های NAD و NADP؛ در فرآورده‌های دارویی و مکمل‌های خوراکی برای پیشگیری یا درمان کمبود نیاسین؛ در برخی فرآورده‌های موضعی و آرایشی به‌عنوان ماده مؤثر بر متابولیسم سلولی و پوست؛ در ترکیبات موضعی، گاهی برای کمک به افزایش جریان خون موضعی استفاده می‌شود.\n\nنکات فرمولاسیون: نیکوتینیک اسید به علت حلالیت پایین در آب، در فرمولاسیون‌های آبی با غلظت‌های بالا ممکن است به‌خوبی حل نشود. pH فرمولاسیون می‌تواند روی حلالیت آن اثر بگذارد. هنگام تهیه فرآورده موضعی باید یکنواختی پراکندگی/حل‌شدن ماده بررسی شود.\n\nتفاوت با نیکوتینامید: Nicotinic acid = Niacin؛ Nicotinamide = Niacinamide. هر دو فرم ویتامین B3 هستند، اما از نظر فارماکولوژیک و عوارض، به‌خصوص ایجاد flushing، تفاوت مهم دارند.","categories":["سایر"]},{"id":"M-100","title":"تری اتانول آمین (Triethanolamine / Trolamine)","content":"ماده قلیایی و امولسیون‌کننده. کاربردها: تنظیم pH، خنثی کردن کربوپول و تولید ژل، کمک به ساخت امولسیون، افزایش قوام و پایداری. محلول در آب و اتانول و متانول و استون.","categories":["قلیایی‌کننده","امولسیفایر"]},{"id":"M-101","title":"هیدروکسی پروپیل سلولز (Hydroxypropyl Cellulose)","content":"محلول در آب و در الکل. نامحلول در روغن‌ها و گلیسیرین.","categories":["ژل‌کننده"]},{"id":"M-102","title":"پلی اتیلن گلایکول (Polyethylene Glycol)","content":"محلول در آب.","categories":["حلال"]},{"id":"M-103","title":"بالسام پرو (Balsam of Peru)","content":"ضد عفونی کننده. کاربرد در اگزما، هموروئید، زخم بستر.","categories":["ضدعفونی‌کننده"]}],"meta":{"formula_count":277,"monograph_count":103,"categories":["آلرژن تماسی","آنتی‌اکسیدان","آنتی‌بیوتیک","اسیدیفایر","افزاینده حلالیت","افزاینده نفوذ پوستی","افزاینده ویسکوزیته","امولسیفایر","اکسیدکننده","اگزما","بافر","بالم لب","بزاق مصنوعی","بی‌حس‌کننده","بی‌حس‌کننده موضعی","حلال","خلط‌آور","خمیر دندان","خمیر موضعی","دهانی","دهان‌شویه","رتینوئید","ریزش مو","زگیل و میخچه","سایر","سنگ ادراری","ضد آفتاب","ضد آکنه","ضد اسید","ضد التهاب","ضد انگل","ضد اگزما","ضد باکتری","ضد تعریق","ضد خارش","ضد روزاسه","ضد زگیل","ضد سبوره","ضد شقاق","ضد شوره","ضد عفونی‌کننده","ضد قارچ","ضد لک","ضد هموروئید","ضد پروتوزوآ","ضد پسوریازیس","ضد گال","ضدعفونی‌کننده","عامل ترکننده","فراورده‌های جوشان","قابض","قلیایی‌کننده","قلیایی‌کننده سیستمیک","قوام‌دهنده","لایه‌بردار","لوبریکانت","مات‌کننده","محافظ پوست","محافظ پوستی","مرطوب‌کننده","مسکن موضعی","ملین","منبع کربوهیدرات","مکمل","نرم‌کننده","هورمون","وسیله/پایه","پایه","پسوریازیس","پوشک","پیگمانت‌ساز","ژل‌کننده","کراتولیتیک","کورتیکواستروئید"],"version":"2.19"}};const state={tab:'monographs',cat:'همه',catGroup:'همه',q:''};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const norm=s=>String(s||'').toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک');function allCats(){const set=new Set();[...DB.monographs,...DB.formulas].forEach(x=>(x.categories||[]).forEach(c=>set.add(c)));return Array.from(set).sort((a,b)=>a.localeCompare(b,'fa'))}

  'مشکلات پوستی':['ضد التهاب','ضد خارش','اگزما','پسوریازیس','پوشک','محافظ پوست','قابض','مسکن موضعی','بی‌حس‌کننده موضعی'],

};
const ALIAS={'محافظ پوستی':'محافظ پوست','ضد عفونی\u200cکننده':'ضدعفونی\u200cکننده','ضد اگزما':'اگزما','ضد پسوریازیس':'پسوریازیس'};
[...DB.monographs,...DB.formulas].forEach(x=>{if(x.categories)x.categories=[...new Set(x.categories.map(c=>ALIAS[c]||c))]});
[['ضد شقاق','ضد هموروئید','ضد روزاسه','کورتیکواستروئید','بی\u200cحس\u200cکننده'],['ضد انگل'],['ضد شوره','هورمون','آلرژن تماسی'],['رتینوئید','پیگمانت\u200cساز'],[],['اسیدیفایر','بافر','اکسیدکننده','لوبریکانت','مات\u200cکننده','وسیله/پایه'],['منبع کربوهیدرات']].forEach((cs,i)=>Object.values(CAT_GROUPS)[i].push(...cs));
function categoryGroup(cat){for(const [g,cs] of Object.entries(CAT_GROUPS))if(cs.includes(cat))return g;return 'سایر'}
function groupCats(g){const cats=allCats();if(g==='همه')return cats;const preferred=CAT_GROUPS[g]||[];return preferred.filter(c=>cats.includes(c)).concat(cats.filter(c=>categoryGroup(c)===g&&!preferred.includes(c)))}

}

 if(typeof v==='string')return v.split(/[؛;]\s*/).map(t=>t.trim()).filter(Boolean).map(t=>{const m=t.match(/^(.*?)\s+((?:تا\s*|q\.?s\.?\s*)?[\d۰-۹.٫]+\s*[%٪]?)$/i);return m?[m[1],m[2]]:[t,'']});return[]}

 return `<details class="calc"><summary>⚖️ محاسبه برای مقدار دلخواه</summary><div class="calc-box"><label for="calc_t">مقدار نهایی که می‌خواهید بسازید</label><input id="calc_t" class="ad-in" inputmode="decimal" placeholder="مثلاً ۵۰" oninput="calcRun()"><div class="ad-chips">${[30,50,100,200].map(n=>`<button type="button" class="ad-chip" onclick="calcSet(${n})">${n}</button>`).join('')}</div><div class="calc-note" id="calc_note"></div><div id="calc_out"></div></div></details>`}

 const qs=rows.find(r=>r.p.k==='qs');const sumNum=rows.reduce((a,r)=>a+(r.p.k==='num'?r.p.n:0),0);const B=qs?qs.p.n:(sumNum||100);
 note.textContent=qs?'فرمول منبع برای '+fmt(B)+' نوشته شده است.':(sumNum?'مجموع مقادیر منبع '+fmt(sumNum)+' است.':'');
 if(!(T>0)){out.innerHTML='';return}
 const f=T/B;let others=0;
 const res=rows.map(r=>{const p=r.p;if(p.k==='num'){const v=p.n*f;others+=v;return fmt(v)+(p.u?' '+p.u:'')}
  if(p.k==='range')return fmt(p.a*f)+' تا '+fmt(p.b*f)+(p.u?' '+p.u:'');
